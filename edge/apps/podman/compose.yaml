# Mill edge on Podman: the laptop (`make edge-up`, run from the repo root) and RHEL bootc devices
# run this same file. On devices, Red Hat Edge Manager syncs this directory to /etc/mill-edge
# and mill-edge.service runs it.
# Same model, same OVMS server, same KServe v2 API as the OpenShift AI deployment.
# The model comes from the model image ("modelcar"): `make model-image` builds it locally,
# and rolling out a new model = bump the bearing-model tag here and push.
name: mill-edge

services:
  mqtt:
    image: docker.io/library/eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: on-failure

  # Copy the model out of the model image into a shared volume.
  # Root, because a new named volume is root-owned and the image runs as 1001.
  model:
    image: quay.io/rprakashg/bearing-model:1
    user: root
    command: ["cp", "-r", "/models/bearing", "/shared/"]
    volumes:
      - models:/shared

  ovms:
    container_name: mill-edge-ovms
    image: docker.io/openvino/model_server:2024.5
    command: ["--model_name", "bearing", "--model_path", "/models/bearing", "--port", "9000", "--rest_port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - models:/models:ro
    depends_on:
      model: { condition: service_completed_successfully }
    restart: on-failure

  scorer:
    container_name: mill-edge-scorer
    image: quay.io/rprakashg/mill-bearing-ai:0.1.0
    command: ["python", "-m", "bearing.edge.scorer"]
    environment:
      MQTT_HOST: mqtt
      MODEL_URL: http://ovms:8000
      ALERT_THRESHOLD: "0.7"
      ALERT_CONSECUTIVE: "3"
    depends_on: [mqtt, ovms]
    restart: on-failure

  simulator:
    image: quay.io/rprakashg/mill-bearing-ai:0.1.0
    command: ["python", "-m", "bearing.edge.simulator"]
    environment:
      MQTT_HOST: mqtt
      ASSET_ID: planer-3
    depends_on: [mqtt, scorer]
    restart: on-failure

volumes:
  models: {}
