# OPTIONAL: demo-only S3 storage (MinIO) plus the two connections the OpenShift AI tutorial uses.
# Skip this if you already have S3 / OpenShift Data Foundation; create the connections in the dashboard instead.
#   oc project <your-data-science-project>
#   oc apply -f openshift-ai/00-minio-and-connections.yaml
# Credentials are demo values. Do not use this for anything real.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
stringData:
  MINIO_ROOT_USER: minio
  MINIO_ROOT_PASSWORD: minio-demo-123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9090"]
          envFrom: [{ secretRef: { name: minio-root } }]
          env: [{ name: HOME, value: /tmp }]
          ports: [{ containerPort: 9000 }, { containerPort: 9090 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9090, targetPort: 9090 }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          env: [{ name: HOME, value: /tmp }]
          envFrom: [{ secretRef: { name: minio-root } }]
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/models local/pipeline-artifacts
---
# Connections, in the format the OpenShift AI dashboard creates. If your version's dashboard does not
# list them, delete these two and create "My Storage" and "Pipeline Artifacts" in the dashboard instead.
apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-my-storage
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: My Storage
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio-demo-123
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_ENDPOINT: http://minio:9000
  AWS_S3_BUCKET: models
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-pipeline-artifacts
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type: s3
    opendatahub.io/connection-type-ref: s3
    openshift.io/display-name: Pipeline Artifacts
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio-demo-123
  AWS_DEFAULT_REGION: us-east-1
  AWS_S3_ENDPOINT: http://minio:9000
  AWS_S3_BUCKET: pipeline-artifacts
